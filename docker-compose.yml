services:
  studycheck:
    build: .
    ports:
      - "8001:8001"
    environment:
      STUDYCHECK_HOST: 0.0.0.0
      STUDYCHECK_PORT: 8001
      STUDYCHECK_DB: /data/studycheck.db
    volumes:
      - studycheck_data:/data
      - studycheck_uploads:/app/uploads
    restart: unless-stopped

volumes:
  studycheck_data:
  studycheck_uploads:
