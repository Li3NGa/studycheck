<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyCheck</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:960px;margin:40px auto;padding:0 20px}input,button{padding:10px;margin:6px 0}button{cursor:pointer}.card{border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px}</style><h1>StudyCheck</h1><p>资料驱动的学习与复习 MVP</p><div class="card"><h2>1. 上传学习资料</h2><input id="user" placeholder="用户ID"><input id="file" type="file" accept=".txt,.pdf,.docx"><button onclick="upload()">开始学习</button></div><div class="card"><h2>2. 查看进度</h2><input id="uid" placeholder="用户ID"><button onclick="progress()">刷新进度</button></div><div class="card"><h2>3. 复习队列</h2><input id="qid" placeholder="用户ID"><button onclick="queue()">查看待复习</button></div><div class="card"><h2>套餐</h2><button onclick="pricing()">查看 Pricing</button></div><pre id="out">等待操作…</pre><script>const out=x=>document.querySelector('#out').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);async function b64(f){return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.onerror=j;x.readAsDataURL(f)});}async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw x;return x;}async function upload(){try{const f=document.querySelector('#file').files[0];out(await post('/api/v1/materials/upload',{user_id:document.querySelector('#user').value,filename:f.name,content_base64:await b64(f)}))}catch(e){out(e)}}async function progress(){try{const r=await fetch('/api/v1/users/'+document.querySelector('#uid').value+'/progress');out(await r.json())}catch(e){out(e)}}async function queue(){try{const r=await fetch('/api/v1/users/'+document.querySelector('#qid').value);out(await r.json())}catch(e){out(e)}}async function pricing(){try{const r=await fetch('/api/v1/pricing');out(await r.json())}catch(e){out(e)}}</script></html>
